  full-poc-multi-node-mix-tests:
    name: multi-node-mix-poc
    if: ${{ github.repository == 'sgl-project/sglang' }}
    needs: [set-image-config]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_config:
          # kimi_k2_6 performance tests
          - name: kimi_k2_6_w4a8_16p_in64k_out1k_100ms_aime25
            node_size: 2
            test_case: test/registered/npu/accuracy/kimi_k2_6/test_npu_kimi_k2_6_w4a8_16p_in64k_out1k_100ms_aime25.py
            test_type: 'accuracy'
    uses: ./.github/workflows/nightly-test-npu-e2e-multi-node.yml
    with:
      runner: linux-amd64-cpu-4
      test_type: ${{ matrix.test_config.test_type || 'perf' }}
      test_config_name: ${{ matrix.test_config.name }}
      node_size: ${{ matrix.test_config.node_size }}
      test_case: ${{ matrix.test_config.test_case }}
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      install_sglang_from_source: false
      prefill_decode_deployment: 'mix'
      transformers_version: ''

  # PR #1222 专用验证 job：DeepSeek-V4-Flash W8A8 16 卡性能用例改用 shell 脚本拉服务。
  # 服务由 scripts/ci/npu/launch_dsv4_flash_w8a8_server.sh（.claude/2.sh 的 CI 适配版）
  # 后台拉起，测试用例通过 SGLANG_EXTERNAL_SERVER_URL 直连外部服务，
  # 跳过框架内置的 popen_launch_server，用于隔离"框架拉起方式"导致的启动崩溃问题。
  dsv4-flash-external-server-test:
    name: dsv4-flash-external-server-test
    if: ${{ github.repository != 'sgl-project/sglang' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    needs: [set-image-config]
    runs-on: linux-aarch64-a3-16
    container:
      image: ${{ needs.set-image-config.outputs.image_a3 }}
    timeout-minutes: 480
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-image-config.outputs.ref || github.ref }}

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Check npu info
        run: |
          npu-smi info

      - name: Prepare environment
        run: |
          # 镜像预装 sglang：与 nightly pipeline 一致，仅把 PR 中的 ascend 测试
          # utils 同步到安装目录（测试用例 import 的是 /sgl-workspace 下的版本）。
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r $(pwd)/python/sglang/test/ascend ${ascend_test_util_path}
          ln -sf $(pwd) /root/sglang

      # 用 shell 脚本（2.sh 的 CI 版）拉起服务：脚本内轮询 /health 直到就绪才返回。
      # 与框架拉起的差异点：入口为 python3 -m sglang.launch_server（非 sglang serve）、
      # 环境变量由脚本显式 export（含 2.sh 的全部稳定/性能变量）。
      - name: Launch server via shell script
        timeout-minutes: 120
        run: |
          bash scripts/ci/npu/launch_dsv4_flash_w8a8_server.sh 30000

      - name: Run test against external server
        timeout-minutes: 240
        env:
          SGLANG_USE_MODELSCOPE: true
          SGLANG_IS_IN_CI: true
          HF_ENDPOINT: https://hf-mirror.com
          TRANSFORMERS_VERBOSITY: "error"
          SGLANG_EXTERNAL_SERVER_URL: http://127.0.0.1:30000
        run: |
          set -o pipefail
          python -u test/registered/npu/performance/deepseek_v4_flash/test_npu_deepseek_v4_flash_w8a8_8p_in8k_out1k_50ms.py 2>&1 | tee /tmp/test_output.log

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/dsv4_flash_server.pid ]; then
            kill $(cat /tmp/dsv4_flash_server.pid) 2>/dev/null || true
          fi
          pkill -f "sglang.launch_server" 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsv4-flash-external-server-logs
          path: |
            /tmp/dsv4_flash_server.log
            /tmp/test_output.log
          if-no-files-found: ignore

  check-all-jobs:
    if: github.repository == 'sgl-project/sglang' && always()
    needs:
      - nighly-test-npu
      - full-4-npu-a2
      - full-1-npu-a3
      - full-2-npu-a3
      - full-4-npu-a3
      - full-8-npu-a3
      - full-16-npu-a3
      - full-acc-2-npu-a3
      - full-acc-4-npu-a3
      - full-acc-16-npu-a3
      - full-perf-2-npu-a3
      - full-perf-4-npu-a3
      - full-perf-8-npu-a3
      - full-perf-16-npu-a3
      - full-poc-multi-node-mix-tests
    runs-on: ubuntu-latest
    container:
      image: docker.m.daocloud.io/ubuntu:22.04
    steps:
      - name: Check if any job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more nightly test jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more nightly test jobs were cancelled"
            exit 1
          fi
          echo "All nightly test jobs passed"
